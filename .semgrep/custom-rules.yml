# Règles semgrep maison — patterns spécifiques BricBudget.
# Chargées en CI via `semgrep scan --config .semgrep/ ...` (voir .github/workflows/ci.yml).

rules:
  - id: decimal-from-float
    languages: [python]
    severity: ERROR
    message: >-
      Decimal(float(...)) perd en précision (flottant binaire IEEE-754).
      Utiliser Decimal(str(x)) — règle de précision monétaire (CLAUDE.md).
      Decimal(int) et Decimal(str) sont corrects.
    # Capture l'anti-pattern explicite Decimal(float(...)). Le cas Decimal(var_float)
    # n'est pas détectable statiquement (type inconnu) — couvert par convention + revue.
    pattern: Decimal(float(...))
    metadata:
      category: correctness
      technology: [python, django]
      confidence: HIGH
      cwe:
        - "CWE-682: Incorrect Calculation"
      references:
        - https://docs.python.org/3/library/decimal.html#decimal.Decimal

  - id: silent-except-pass
    languages: [python]
    severity: WARNING
    message: >-
      except silencieux — toute erreur avalée doit être tracée (#132) :
      logger.exception() si c'est une erreur, logger.debug() si c'est un
      contrôle de flux volontaire. Cas justifié → # nosemgrep: silent-except-pass
      avec un commentaire expliquant POURQUOI le silence est correct.
    patterns:
      - pattern-either:
          - pattern: |
              try:
                  ...
              except $EX:
                  pass
          - pattern: |
              try:
                  ...
              except:
                  pass
    paths:
      exclude:
        - "**/tests/**"
        - "**/migrations/**"
    metadata:
      category: maintainability
      technology: [python, django]
      confidence: HIGH
      references:
        - https://docs.python.org/3/howto/logging.html
