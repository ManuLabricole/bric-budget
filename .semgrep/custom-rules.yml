# Règles semgrep maison — patterns spécifiques BricBudget.
# Chargées en CI via `semgrep scan --config .semgrep/ ...` (voir .github/workflows/ci.yml).

rules:
  - id: decimal-from-float
    languages: [python]
    severity: ERROR
    message: >-
      Decimal(float(...)) perd en précision (flottant binaire IEEE-754).
      Utiliser Decimal(str(x)) — règle de précision monétaire (CLAUDE.md).
      Decimal(int) et Decimal(str) sont corrects.
    # Capture l'anti-pattern explicite Decimal(float(...)). Le cas Decimal(var_float)
    # n'est pas détectable statiquement (type inconnu) — couvert par convention + revue.
    pattern: Decimal(float(...))
    metadata:
      category: correctness
      technology: [python, django]
      confidence: HIGH
      cwe:
        - "CWE-682: Incorrect Calculation"
      references:
        - https://docs.python.org/3/library/decimal.html#decimal.Decimal
