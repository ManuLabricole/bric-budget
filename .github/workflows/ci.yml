# .github/workflows/ci.yml — BricBudget CI
#
# Ce workflow tourne sur chaque PR et push vers development / main.
# Il vérifie que le code est propre avant de merger.
#
# Pipeline :
#   1. lint    — ruff (Python) + djlint (templates)
#   2. test    — pytest avec une vraie DB PostgreSQL
#
# Railway gère le déploiement automatiquement à partir du repo GitHub.
# Ce fichier ne déploie rien — il bloque seulement les merges cassés.

name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - development
      - main

# Un seul run CI par branche/PR à la fois — annule le run précédent si un nouveau push arrive.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Moindre privilège : aucun job de cette CI n'écrit dans le repo (lint/test/smoke/e2e/
# release-commands sont read-only). Le GITHUB_TOKEN est restreint en lecture.
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Changes (path filter) ───────────────────────────────────────────────────
  # Détecte si du CODE testable a changé. Les jobs lourds (test/e2e/reference-data/
  # deploy-guard/security/lint) ne tournent QUE si `code == true` → une PR docs/.claude/
  # configs ne lance que `changes` + `secrets` + la sentinelle (#261). `secrets` (gitleaks)
  # reste TOUJOURS actif : un IBAN/token fuité dans un .md/.claude doit être scanné.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    permissions:
      contents: read        # requis par actions/checkout (le job-level remplace l'héritage)
      pull-requests: read   # requis par dorny/paths-filter sur pull_request
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'pyproject.toml'
              - 'poetry.lock'
              - 'Dockerfile'
              - 'nixpacks.toml'
              - 'scripts/**'
              - '.github/workflows/ci.yml'
              - '.semgrep/**'
              - 'tailwind.config.js'
              - 'package.json'
              - 'package-lock.json'
              - 'conftest.py'           # conftest racine = fixtures pytest globales

  # ── Lint ────────────────────────────────────────────────────────────────────
  # Vérifie le style Python (ruff) et les templates Django (djlint).
  # Ce job ne touche pas la DB — il est rapide (~10s).
  lint:
    name: Lint (ruff + djlint)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Poetry
        run: pip install poetry

      # Cache du virtualenv Poetry, clé = hash de poetry.lock + version Python.
      # Aujourd'hui chaque job réinstalle tout de zéro (×4). Le cache rend
      # `poetry install` quasi instantané sur les runs où le lock n'a pas bougé (#156).
      - name: Cache Poetry virtualenv
        uses: actions/cache@v6
        with:
          path: ~/.cache/pypoetry/virtualenvs
          key: poetry-venv-${{ runner.os }}-py3.13-${{ hashFiles('poetry.lock') }}
          restore-keys: |
            poetry-venv-${{ runner.os }}-py3.13-

      # --no-root : on installe les dépendances mais pas le projet lui-même
      # (il n'y a pas de package Python à installer, juste une app Django)
      - name: Install dependencies
        run: poetry install --no-root

      - name: ruff — lint Python
        run: poetry run ruff check src/

      - name: ruff — format check
        run: poetry run ruff format --check src/

      - name: djlint — lint templates
        run: poetry run djlint src/templates/ --profile=django --lint

      # vulture — détection de code mort. INFORMATIF (continue-on-error) : il
      # remonte des faux positifs connus (args schema_editor des migrations RunPython,
      # params queryset des actions admin) → on exclut migrations/tests et on ne bloque
      # PAS la CI tant que le backlog n'est pas nettoyé (#156). Résumé sur la PR.
      - name: vulture — dead code (informatif)
        id: vulture
        continue-on-error: true
        run: |
          poetry run vulture src/ \
            --min-confidence 80 \
            --exclude "*/migrations/*,*/tests/*" \
            | tee vulture-report.txt

      - name: vulture — résumé PR
        if: always()
        run: |
          {
            echo "### 🦅 vulture — code mort potentiel (informatif)";
            if [ -s vulture-report.txt ]; then
              echo '```';
              cat vulture-report.txt;
              echo '```';
            else
              echo "Aucun code mort détecté.";
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # djhtml — formatage des templates Django. INFORMATIF : 23 templates ne sont
      # pas encore au format djhtml ; on liste les écarts sans bloquer (#156). À
      # passer en bloquant une fois le backlog templates reformaté (issue dédiée).
      - name: djhtml — format templates (informatif)
        id: djhtml
        continue-on-error: true
        run: |
          poetry run djhtml --check src/templates/ | tee djhtml-report.txt

      - name: djhtml — résumé PR
        if: always()
        run: |
          {
            echo "### 🧱 djhtml — formatage templates (informatif)";
            echo '```';
            cat djhtml-report.txt 2>/dev/null || echo "(rien à signaler)";
            echo '```';
          } >> "$GITHUB_STEP_SUMMARY"

      # bandit — linter sécurité Python (PyCQA). Seuil médium+ : on ignore les Low
      # (essentiellement les `assert` de pytest = B101, non pertinents).
      - name: bandit — Python security lint
        run: poetry run bandit -r src/ --severity-level medium

      # pip-audit — CVE des dépendances installées (PyPA). Aucune exception :
      # toute CVE fait échouer la CI.
      - name: pip-audit — dependency CVEs
        run: poetry run pip-audit

      - name: Generate CI secret key
        run: python3 -c "import secrets; print('SECRET_KEY=' + secrets.token_urlsafe(50))" >> "$GITHUB_ENV"

      # mypy — vérification de types (plugin Django). DATABASE_URL dummy :
      # mypy charge les settings pour introspecter les models mais ne se connecte PAS à la DB.
      # SECRET_KEY injecté depuis $GITHUB_ENV (step précédent).
      - name: mypy — type check
        env:
          DATABASE_URL: "postgresql://u:p@localhost:5432/db"
          DEBUG: "True"
        run: cd src && poetry run mypy . --config-file ../pyproject.toml

  # ── Tests ───────────────────────────────────────────────────────────────────
  # Lance les 323 tests pytest avec une vraie DB PostgreSQL.
  # Django crée un test_bricbudget automatiquement, le détruit en fin de job.
  test:
    name: Tests (pytest)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest

    # Service PostgreSQL — lancé dans un container Docker auxiliaire.
    # Django s'y connecte via localhost:5432 pendant les tests.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bricbudget
          POSTGRES_USER: bricbudget
          POSTGRES_PASSWORD: bricbudget
        ports:
          - 5432:5432
        # Health check : GitHub Actions attend que Postgres soit prêt
        # avant de passer aux steps suivants.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DEBUG: "True"
      # Convention 12-factor : DATABASE_URL décrit toute la connexion.
      # Même format qu'en local et sur Railway — cohérence locale/CI/prod.
      # Pointe vers le service postgres: du workflow (host=localhost, port=5432).
      DATABASE_URL: postgresql://bricbudget:bricbudget@localhost:5432/bricbudget
      # IMPORT_ENCRYPTION_KEY vide → autorisé (settings.py, default="").
      # La clé n'est requise qu'au moment d'un import web, pas pendant les tests.
      IMPORT_ENCRYPTION_KEY: ""
      # ADMIN_URL : valeur par défaut "admin" (settings.py)
      ADMIN_URL: admin

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Poetry
        run: pip install poetry

      - name: Cache Poetry virtualenv
        uses: actions/cache@v6
        with:
          path: ~/.cache/pypoetry/virtualenvs
          key: poetry-venv-${{ runner.os }}-py3.13-${{ hashFiles('poetry.lock') }}
          restore-keys: |
            poetry-venv-${{ runner.os }}-py3.13-

      - name: Install dependencies
        run: poetry install --no-root

      - name: Generate CI secret key
        run: python3 -c "import secrets; print('SECRET_KEY=' + secrets.token_urlsafe(50))" >> "$GITHUB_ENV"

      # Les migrations doivent tourner avant pytest.
      # pytest-django crée la test_db à partir des migrations — pas de fixtures SQL.
      # SECRET_KEY injecté depuis $GITHUB_ENV (step précédent).
      - name: Run migrations
        run: cd src && poetry run python manage.py migrate

      # Conformité modèle↔migration (#197, recoupe #165) : échoue si un champ ou une
      # contrainte a changé sur un modèle sans migration générée. --check => exit
      # non-zéro en cas de dérive ; --dry-run => n'écrit aucun fichier. Un modèle
      # modifié sans `makemigrations` ⇒ CI rouge (critère d'acceptation #197).
      - name: makemigrations --check (dérive modèle↔migration)
        run: cd src && poetry run python manage.py makemigrations --check --dry-run

      # pytest, lancé depuis la RACINE (pas `cd src`) pour que [tool.coverage]
      # de pyproject.toml s'applique (source=["src"], omit migrations/tests) :
      #   -n auto      → pytest-xdist : ~950 tests répartis sur tous les cœurs (#156).
      #   --reuse-db   → réutilise la test_db migrée ci-dessus, skip la recréation.
      #   --cov ...    → mesure la couverture (#154). --cov-fail-under=78 : seuil
      #                  ancré 2 pts sous la baseline réelle (80%) → bloque toute
      #                  régression nette sans casser sur du bruit. term-missing
      #                  + le résumé ci-dessous rendent le % visible sur la PR.
      # -p no:randomly : pytest-randomly est déjà installé (dep historique) et
      # randomiserait l'ordre → risque de flaky en semaine de release. On fige
      # l'ordre en CI (désactivation explicite du plugin), sans toucher la dep (#156).
      # Feature PR (-> development) : pytest NU, sans coverage -> plus rapide.
      # Couverture + gate bloquant reportes au contexte release (ci-dessous). (#261)
      - name: Run tests (feature PR — sans coverage)
        if: github.event_name == 'pull_request' && github.base_ref == 'development'
        run: |
          poetry run pytest --color=yes -q \
            -p no:randomly \
            -n auto --reuse-db

      # Release (PR->main ou push main) : suite COMPLETE + coverage + gate bloquant
      # (--cov-fail-under=78) = LA barriere couverture avant prod. (#261)
      - name: Run tests + coverage (release — gate bloquant)
        if: github.event_name == 'push' || github.base_ref == 'main'
        run: |
          poetry run pytest --color=yes -q \
            -p no:randomly \
            -n auto --reuse-db \
            --cov --cov-report=term-missing --cov-report=xml \
            --cov-fail-under=78

      # Publie le % de couverture + le total directement sur la page de la PR
      # ($GITHUB_STEP_SUMMARY) → visible sans ouvrir les logs (#154).
      - name: Coverage — résumé PR
        if: github.event_name == 'push' || github.base_ref == 'main'
        run: |
          {
            echo "### 🧪 Couverture de test";
            echo "Seuil bloquant : **78 %** (baseline réelle 80 %).";
            echo "";
            if [ -f coverage.xml ]; then
              echo "<details><summary>Détail par fichier (term-missing)</summary>";
              echo "";
              poetry run coverage report --format=markdown;
              echo "";
              echo "</details>";
            else
              echo "⚠️ Pas de rapport de couverture (les tests ont échoué avant la mesure).";
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Checklist sécu natif Django, en mode PROD (DEBUG=False) : vérifie HSTS,
      # SSL redirect, cookies sécurisés, SECRET_KEY… --fail-level WARNING => toute
      # régression de config sécu fait échouer la CI. Clé générée au runtime (>50 car).
      - name: Django deploy check (prod config)
        env:
          DEBUG: "False"
          ALLOWED_HOSTS: "example.com"
        run: cd src && poetry run python manage.py check --deploy --fail-level WARNING

  # ── Release commands (référentiels) ─────────────────────────────────────────
  # Rejoue le scénario du release deploy (#126) sur un Postgres réel :
  # migrate → sync_reference_data à froid → 2e run (idempotence) → dry-run.
  # C'est la PREUVE à chaque PR que `migrate && sync_reference_data` (la future
  # Release Command Railway, #135) passera en prod. Un seed cassé = CI rouge.
  reference-data:
    name: Release commands (migrate + sync_reference_data)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bricbudget
          POSTGRES_USER: bricbudget
          POSTGRES_PASSWORD: bricbudget
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DEBUG: "True"
      DATABASE_URL: postgresql://bricbudget:bricbudget@localhost:5432/bricbudget
      IMPORT_ENCRYPTION_KEY: ""
      ADMIN_URL: admin

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Poetry
        run: pip install poetry

      - name: Cache Poetry virtualenv
        uses: actions/cache@v6
        with:
          path: ~/.cache/pypoetry/virtualenvs
          key: poetry-venv-${{ runner.os }}-py3.13-${{ hashFiles('poetry.lock') }}
          restore-keys: |
            poetry-venv-${{ runner.os }}-py3.13-

      - name: Install dependencies
        run: poetry install --no-root

      - name: Generate CI secret key
        run: python3 -c "import secrets; print('SECRET_KEY=' + secrets.token_urlsafe(50))" >> "$GITHUB_ENV"

      - name: Scénario release — froid, idempotence, dry-run
        run: |
          cd src
          poetry run python manage.py migrate --noinput
          poetry run python manage.py sync_reference_data
          poetry run python manage.py sync_reference_data
          poetry run python manage.py sync_reference_data --dry-run

  # ── Deploy guards (collectstatic prod + smoke /healthz/) ─────────────────────
  # Garde-fous contre les régressions « deploy-breaking » qui passent la CI au vert
  # et ne pètent qu'au déploiement Railway (#165, part of #160). Job DÉDIÉ, séparé
  # des jobs existants — ne touche aucun autre step.
  #
  #   1. collectstatic en config PROD (DEBUG=False → CompressedManifestStaticFilesStorage,
  #      settings.py:377) : reproduit EXACTEMENT la phase build de nixpacks.toml:49. En
  #      DEBUG=True le storage est permissif ; un {% static %} cassé n'échoue qu'avec le
  #      manifest → build Railway rouge alors que la CI était verte. Ici → CI rouge.
  #   2. smoke /healthz/ : démarre l'app comme en prod (gunicorn, DEBUG=False) et vérifie
  #      que la route de liveness pinguée par Railway répond 200 en ANONYME. Un middleware
  #      auth global ou un boot cassé la casserait → reboot en boucle. Ici → CI rouge.
  #
  # Note : makemigrations --check n'est PAS ici — il est porté par #197 (PR #223).
  deploy-guard:
    name: Deploy guards (collectstatic + smoke healthz)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest

    # Postgres requis : settings.py lit DATABASE_URL au boot, et gunicorn initialise
    # axes/middleware au démarrage. /healthz/ ne touche pas la DB, mais le boot oui.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bricbudget
          POSTGRES_USER: bricbudget
          POSTGRES_PASSWORD: bricbudget
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://bricbudget:bricbudget@localhost:5432/bricbudget
      IMPORT_ENCRYPTION_KEY: ""
      ADMIN_URL: admin

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Poetry
        run: pip install poetry

      - name: Cache Poetry virtualenv
        uses: actions/cache@v6
        with:
          path: ~/.cache/pypoetry/virtualenvs
          key: poetry-venv-${{ runner.os }}-py3.13-${{ hashFiles('poetry.lock') }}
          restore-keys: |
            poetry-venv-${{ runner.os }}-py3.13-

      - name: Install dependencies
        run: poetry install --no-root

      - name: Generate CI secret key
        run: python3 -c "import secrets; print('SECRET_KEY=' + secrets.token_urlsafe(50))" >> "$GITHUB_ENV"

      # collectstatic en config PROD : reproduit nixpacks.toml:49. DEBUG=False active le
      # manifest storage → un {% static %} cassé fait échouer ce step (donc la CI).
      - name: collectstatic (prod manifest storage)
        env:
          DEBUG: "False"
          ALLOWED_HOSTS: localhost
        run: cd src && poetry run python manage.py collectstatic --noinput

      # axes (middleware actif en DEBUG=False) initialise ses tables au boot gunicorn :
      # sans migrate préalable, le boot crashe → le guard deviendrait rouge pour une
      # mauvaise raison (échec parasite non lié à /healthz/), ou vert par accident si
      # le Postgres du service est recyclé. On migre pour un boot prod fidèle.
      - name: Apply migrations (requis par axes au boot gunicorn)
        env:
          DEBUG: "False"
          ALLOWED_HOSTS: localhost
        run: cd src && poetry run python manage.py migrate --noinput

      # smoke : gunicorn (prod) + curl /healthz/ anonyme → 200. Le manifest généré
      # ci-dessus est requis (CompressedManifest exige staticfiles.json en DEBUG=False).
      - name: Smoke /healthz/ (gunicorn prod boot)
        run: ./scripts/smoke_healthz.sh

  # ── E2E navigateur (Playwright + live_server) ────────────────────────────────
  # Job SÉPARÉ du job `test` (#159) : lance les smokes end-to-end navigateur dans un
  # vrai chromium headless contre un vrai serveur Django (live_server). Ne touche PAS
  # le step `test` principal — ces tests sont opt-in via le marker `e2e` (la suite par
  # défaut les exclut, cf. pyproject `addopts = -m "not e2e"`). Navigateur en cache,
  # artefacts (traces + screenshots) uploadés uniquement en cas d'échec pour debug.
  e2e:
    name: E2E (Playwright)
    needs: changes
    # E2E (job le plus cher) : seulement en contexte RELEASE (push main / PR->main)
    # ou opt-in via label `run-e2e`. Pas sur chaque PR feature -> development. (#261)
    if: >-
      needs.changes.outputs.code == 'true' &&
      ( github.event_name == 'push'
        || github.base_ref == 'main'
        || contains(github.event.pull_request.labels.*.name, 'run-e2e') )
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bricbudget
          POSTGRES_USER: bricbudget
          POSTGRES_PASSWORD: bricbudget
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DEBUG: "True"
      DATABASE_URL: postgresql://bricbudget:bricbudget@localhost:5432/bricbudget
      IMPORT_ENCRYPTION_KEY: ""
      ADMIN_URL: admin

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Poetry
        run: pip install poetry

      - name: Cache Poetry virtualenv
        uses: actions/cache@v6
        with:
          path: ~/.cache/pypoetry/virtualenvs
          key: poetry-venv-${{ runner.os }}-py3.13-${{ hashFiles('poetry.lock') }}
          restore-keys: |
            poetry-venv-${{ runner.os }}-py3.13-

      - name: Install dependencies
        run: poetry install --no-root

      # Cache du navigateur Playwright : ~/.cache/ms-playwright. Clé indexée sur la
      # version de playwright (poetry.lock) → re-télécharge seulement quand elle bouge.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('poetry.lock') }}

      # Binaire navigateur (caché sous ~/.cache/ms-playwright) → re-téléchargé UNIQUEMENT
      # sur cache-miss. Les libs système (fonts, libnss…) ne sont PAS dans ce cache →
      # install-deps tourne toujours. On limite à chromium (1 navigateur = suite stable).
      - name: Install Playwright chromium (binaire — sauté si cache-hit)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: poetry run playwright install chromium
      - name: Install Playwright system deps (libs OS, non cachées)
        run: poetry run playwright install-deps chromium

      - name: Generate CI secret key
        run: python3 -c "import secrets; print('SECRET_KEY=' + secrets.token_urlsafe(50))" >> "$GITHUB_ENV"

      - name: Run migrations
        run: cd src && poetry run python manage.py migrate --noinput

      # -m e2e : opt-in explicite (la suite par défaut exclut ce marker).
      # --reuse-db : réutilise la base migrée ci-dessus. -p no:randomly : ordre figé.
      # --screenshot/--tracing only-on-failure : artefacts de debug seulement si rouge.
      - name: Run E2E tests (headless)
        run: |
          poetry run pytest -m e2e -q \
            -p no:randomly --reuse-db \
            --screenshot=only-on-failure \
            --tracing=retain-on-failure \
            --output=e2e-artifacts

      # En cas d'échec, on remonte traces Playwright + screenshots → ouvrables dans
      # trace.playwright.dev pour rejouer le parcours pas à pas (critère d'acceptation).
      - name: Upload E2E artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-artifacts
          path: e2e-artifacts/
          retention-days: 7
          if-no-files-found: ignore

  # ── Security (semgrep SAST) ──────────────────────────────────────────────────
  # Analyse statique de sécurité avec les rulesets registry semgrep (Django / OWASP
  # / secrets), maintenus par la communauté. `--error` fait échouer la CI sur toute
  # NOUVELLE faille. Les findings acceptés ou faux positifs sont neutralisés par des
  # commentaires `# nosemgrep` (ex: SHA1 de déduplication non-crypto). La règle
  # django-no-csrf-token est exclue : faux positifs sur nos forms qui ONT déjà le
  # token, et CsrfViewMiddleware impose le CSRF au runtime (form sans token = 403).
  security:
    name: Security (semgrep SAST)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install semgrep
        run: python -m pip install semgrep==1.164.0

      - name: semgrep scan
        run: semgrep scan --config .semgrep/ --config p/django --config p/python --config p/secrets --exclude-rule python.django.security.django-no-csrf-token.django-no-csrf-token --error --metrics off src/

  # ── Secrets (gitleaks) ───────────────────────────────────────────────────────
  # Scanne tout l'historique git à la recherche de secrets (clés API, tokens, IBAN…).
  # fetch-depth: 0 = historique complet. Toute fuite détectée fait échouer la CI.
  secrets:
    name: Secrets (gitleaks)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/gitleaks/gitleaks:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: gitleaks detect
        run: gitleaks detect --source . --redact --no-banner

  # ── Sentinelle (seul required check) ─────────────────────────────────────────
  # Résout le piège des required checks + path-filter : un job lourd SKIPPÉ sur une
  # PR docs resterait « Expected — waiting » s'il était lui-même required. À la place,
  # CE job agrège tous les autres et devient le SEUL required en branch protection.
  # success/skipped = OK ; failure/cancelled = rouge. (#261, research §C.1)
  alls-green:
    name: CI green (required)
    if: always()
    needs: [changes, lint, test, reference-data, deploy-guard, e2e, security, secrets]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        run: |
          echo "results: ${{ join(needs.*.result, ' ') }}"
          for r in ${{ join(needs.*.result, ' ') }}; do
            case "$r" in
              failure|cancelled)
                echo "::error::A required job did not pass (result=$r)"; exit 1;;
            esac
          done
          echo "All required jobs passed or were skipped — OK."
