# .github/workflows/ci.yml — BricBudget CI
#
# Ce workflow tourne sur chaque PR et push vers development / main.
# Il vérifie que le code est propre avant de merger.
#
# Pipeline :
#   1. lint    — ruff (Python) + djlint (templates)
#   2. test    — pytest avec une vraie DB PostgreSQL
#
# Railway gère le déploiement automatiquement à partir du repo GitHub.
# Ce fichier ne déploie rien — il bloque seulement les merges cassés.

name: CI

on:
  push:
    branches:
      - development
      - main
  pull_request:
    branches:
      - development
      - main

# Un seul run CI par branche/PR à la fois — annule le run précédent si un nouveau push arrive.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Lint ────────────────────────────────────────────────────────────────────
  # Vérifie le style Python (ruff) et les templates Django (djlint).
  # Ce job ne touche pas la DB — il est rapide (~10s).
  lint:
    name: Lint (ruff + djlint)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Poetry
        run: pip install poetry

      # --no-root : on installe les dépendances mais pas le projet lui-même
      # (il n'y a pas de package Python à installer, juste une app Django)
      - name: Install dependencies
        run: poetry install --no-root

      - name: ruff — lint Python
        run: poetry run ruff check src/

      - name: ruff — format check
        run: poetry run ruff format --check src/

      - name: djlint — lint templates
        run: poetry run djlint src/templates/ --profile=django --lint

      # bandit — linter sécurité Python (PyCQA). Seuil médium+ : on ignore les Low
      # (essentiellement les `assert` de pytest = B101, non pertinents).
      - name: bandit — Python security lint
        run: poetry run bandit -r src/ --severity-level medium

      # pip-audit — CVE des dépendances installées (PyPA). Aucune exception :
      # toute CVE fait échouer la CI.
      - name: pip-audit — dependency CVEs
        run: poetry run pip-audit

      # mypy — vérification de types (plugin Django). SECRET_KEY/DATABASE_URL dummy :
      # mypy charge les settings pour introspecter les models mais ne se connecte PAS à la DB.
      - name: mypy — type check
        env:
          SECRET_KEY: "ci-mypy-only-aB3dE5fG7hJ9kL1mN3pQ5rS7tU9vW1xY3z"
          DATABASE_URL: "postgresql://u:p@localhost:5432/db"
          DEBUG: "True"
        run: cd src && poetry run mypy . --config-file ../pyproject.toml

  # ── Tests ───────────────────────────────────────────────────────────────────
  # Lance les 323 tests pytest avec une vraie DB PostgreSQL.
  # Django crée un test_bricbudget automatiquement, le détruit en fin de job.
  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest

    # Service PostgreSQL — lancé dans un container Docker auxiliaire.
    # Django s'y connecte via localhost:5432 pendant les tests.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bricbudget
          POSTGRES_USER: bricbudget
          POSTGRES_PASSWORD: bricbudget
        ports:
          - 5432:5432
        # Health check : GitHub Actions attend que Postgres soit prêt
        # avant de passer aux steps suivants.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Clé secrète fictive — uniquement pour signer les sessions en test.
      SECRET_KEY: ci-secret-key-not-used-in-production
      DEBUG: "True"
      # Convention 12-factor : DATABASE_URL décrit toute la connexion.
      # Même format qu'en local et sur Railway — cohérence locale/CI/prod.
      # Pointe vers le service postgres: du workflow (host=localhost, port=5432).
      DATABASE_URL: postgresql://bricbudget:bricbudget@localhost:5432/bricbudget
      # IMPORT_ENCRYPTION_KEY vide → autorisé (settings.py, default="").
      # La clé n'est requise qu'au moment d'un import web, pas pendant les tests.
      IMPORT_ENCRYPTION_KEY: ""
      # ADMIN_URL : valeur par défaut "admin" (settings.py)
      ADMIN_URL: admin

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install --no-root

      # Les migrations doivent tourner avant pytest.
      # pytest-django crée la test_db à partir des migrations — pas de fixtures SQL.
      - name: Run migrations
        run: cd src && poetry run python manage.py migrate

      - name: Run tests
        run: cd src && poetry run pytest --color=yes -q

      # Checklist sécu natif Django, en mode PROD (DEBUG=False) : vérifie HSTS,
      # SSL redirect, cookies sécurisés, SECRET_KEY… --fail-level WARNING => toute
      # régression de config sécu fait échouer la CI. SECRET_KEY dummy >50 car.
      # (sinon faux W009), DATABASE_URL héritée du job (check statique, pas de connexion).
      - name: Django deploy check (prod config)
        env:
          DEBUG: "False"
          SECRET_KEY: "ci-deploy-check-only-aB3dE5fG7hJ9kL1mN3pQ5rS7tU9vW1xY3z"
          ALLOWED_HOSTS: "example.com"
        run: cd src && poetry run python manage.py check --deploy --fail-level WARNING

  # ── Security (semgrep SAST) ──────────────────────────────────────────────────
  # Analyse statique de sécurité avec les rulesets registry semgrep (Django / OWASP
  # / secrets), maintenus par la communauté. `--error` fait échouer la CI sur toute
  # NOUVELLE faille. Les findings acceptés ou faux positifs sont neutralisés par des
  # commentaires `# nosemgrep` (ex: SHA1 de déduplication non-crypto). La règle
  # django-no-csrf-token est exclue : faux positifs sur nos forms qui ONT déjà le
  # token, et CsrfViewMiddleware impose le CSRF au runtime (form sans token = 403).
  security:
    name: Security (semgrep SAST)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: semgrep scan
        run: semgrep scan --config .semgrep/ --config p/django --config p/python --config p/secrets --exclude-rule python.django.security.django-no-csrf-token.django-no-csrf-token --error --metrics off src/

  # ── Secrets (gitleaks) ───────────────────────────────────────────────────────
  # Scanne tout l'historique git à la recherche de secrets (clés API, tokens, IBAN…).
  # fetch-depth: 0 = historique complet. Toute fuite détectée fait échouer la CI.
  secrets:
    name: Secrets (gitleaks)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/gitleaks/gitleaks:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks detect
        run: gitleaks detect --source . --redact --no-banner
