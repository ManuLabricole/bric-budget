services:

  db:
    image: postgres:16
    # Le container s'appelle "bricbudget-db" pour qu'il soit facile à identifier
    container_name: bricbudget-db
    restart: unless-stopped

    # Credentials du container PostgreSQL local (dev uniquement — non-secrets).
    # Correspondent aux valeurs dans DATABASE_URL du .env local :
    #   postgresql://bricbudget:bricbudget@localhost:5433/bricbudget
    environment:
      POSTGRES_DB: bricbudget
      POSTGRES_USER: bricbudget
      POSTGRES_PASSWORD: bricbudget

    ports:
      # Expose PostgreSQL sur localhost:5432 pour que Django (sur le Mac) puisse s'y connecter
      # Format : "port_du_mac:port_du_container"
      # 5433 sur le Mac → 5432 dans le container (évite conflit avec PostgreSQL Homebrew)
      - "5433:5432"

    volumes:
      # Persistance des données : même si le container est supprimé, les données restent
      # Docker gère ce volume nommé automatiquement
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      # Vérifie que PostgreSQL est prêt à accepter des connexions
      test: ["CMD-SHELL", "pg_isready -U bricbudget -d bricbudget"]
      interval: 5s
      timeout: 5s
      retries: 5

# Déclaration du volume nommé — Docker le crée et le gère sur ton Mac
volumes:
  postgres_data:
