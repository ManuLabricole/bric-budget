{% load budget_filters static %}
{% comment %}
budget/partials/_budget_left_section.html — Section gauche Budget (Cashflow).

Rendu complet à chaque swap HTMX depuis toggle_filter_category.
Le <script> inline ré-initialise ECharts Sankey après chaque swap.

Paramètre :
  filter_open — bool — si True, <details> categories-filter-details rendu ouvert
{% endcomment %}
<div id="budget-left-section" class="bg-surface-3/70 backdrop-blur-xl border border-edge/60 rounded-xl relative z-[1]">
<div class="flex flex-col gap-0 p-5">
{# ── Navigation période ───────────────────────────────────────────────── #}
{% include "components/period/period_nav.html" with period_mode=period_mode period_display=period_display can_go_next=can_go_next nav_url_name="budget:set_period" %}
<div class="border-t border-edge my-3"></div>
{# ── Header Cashflow + contrôles ──────────────────────────────────────── #}
<div class="flex items-center justify-between pb-2">
<h2 class="text-sm font-semibold text-text-base">Cashflow</h2>
<div class="flex items-center gap-2">
{# Toggle sous-catégories — Soon #}
<label class="flex items-center gap-1.5 select-none opacity-40 cursor-not-allowed" title="Bientôt disponible">
<span class="text-xs text-text-muted">Sous-catégories</span>
<div class="w-7 h-3.5 bg-surface-hover border border-edge rounded-full relative">
<div class="w-2.5 h-2.5 bg-text-disabled rounded-full absolute top-[1px] left-[1px]"></div>
</div>
</label>
{# Filtre catégories — HTMX : hx-target garde le dropdown ouvert après swap #}
{# cat_filter_open évite la pollution de filter_accounts.html (qui lit filter_open) #}
{% include "components/filters/filter_categories.html" with all_categories=all_categories hidden_cat_slugs=hidden_cat_slugs toggle_url_name="budget:toggle_filter_category" htmx_target="#budget-left-section" filter_open=cat_filter_open %}
{# Filtre comptes — HTMX : hx-target garde le dropdown ouvert après swap #}
{% include "components/filters/filter_accounts.html" with accounts=accounts hidden_account_ids=filter_account_ids toggle_url_name="budget:toggle_filter_account" htmx_target="#budget-left-section" filter_open=acc_filter_open %}
{# Icônes copie + expand — Soon #}
<button class="w-7 h-7 flex items-center justify-center rounded-full text-text-disabled opacity-30 cursor-not-allowed" title="Bientôt disponible" disabled>
<svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
<path stroke-linecap="round" stroke-linejoin="round" d="M15.75 17.25v3.375c0 .621-.504 1.125-1.125 1.125h-9.75a1.125 1.125 0 0 1-1.125-1.125V7.875c0-.621.504-1.125 1.125-1.125H6.75a9.06 9.06 0 0 1 1.5.124m7.5 10.376h3.375c.621 0 1.125-.504 1.125-1.125V11.25c0-4.46-3.243-8.161-7.5-8.876a9.06 9.06 0 0 0-1.5-.124H9.375c-.621 0-1.125.504-1.125 1.125v3.5m7.5 10.375H9.375a1.125 1.125 0 0 1-1.125-1.125v-9.25m12 6.625v-1.875a3.375 3.375 0 0 0-3.375-3.375h-1.5a1.125 1.125 0 0 1-1.125-1.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H9.75" />
</svg>
</button>
<button class="w-7 h-7 flex items-center justify-center rounded-full text-text-disabled opacity-30 cursor-not-allowed" title="Bientôt disponible" disabled>
<svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
<path stroke-linecap="round" stroke-linejoin="round" d="M3.75 3.75v4.5m0-4.5h4.5m-4.5 0L9 9M3.75 20.25v-4.5m0 4.5h4.5m-4.5 0L9 15M20.25 3.75h-4.5m4.5 0v4.5m0-4.5L15 9m5.25 11.25h-4.5m4.5 0v-4.5m0 4.5L15 15" />
</svg>
</button>
</div>
</div>
{# ── Graphique Sankey — ECharts ────────────────────────────────────────── #}
{{ sankey_data|json_script:"sankey-data" }}
<div id="sankey-chart" class="w-full mb-2" style="height: 38vh; min-height: 180px" data-chart="sankey" data-chart-data="sankey-data" data-on-click-url="/budget/categorie/{slug}/">
</div>
{# ── KPIs — tabs cliquables ───────────────────────────────────────────── #}
<div class="flex items-end gap-0 border-b border-edge pt-3 mt-1">
{% comment %}
    Pattern commun pour les 3 tabs cliquables :
    - Inactif : label gris + montant blanc, hover → gold
    - Actif   : label gold + montant gold + soulignement fin (border-b 1px)
    - -mb-px  : le border-b déborde d'1px sur le border-b du parent pour se superposer proprement
{% endcomment %}
{# Entrées #}
<a href="{% url 'budget:set_tab' 'entrees' %}" class="group flex flex-col items-start gap-1 pb-3 pr-8 cursor-pointer transition-colors {% if active_tab == 'entrees' %}text-gold border-b border-gold -mb-px{% else %}text-text-base hover:text-gold{% endif %}">
<span class="flex items-center gap-1.5 text-[9px] font-medium uppercase tracking-wide transition-colors {% if active_tab == 'entrees' %}text-gold{% else %}text-text-muted group-hover:text-gold{% endif %}">
<svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
<path stroke-linecap="round" stroke-linejoin="round" d="m4.5 19.5 15-15m0 0H8.25m11.25 0v11.25" />
</svg>
Entrées
</span>
<span class="text-base font-bold">+{{ total_income|chf_pref:show_decimals }} CHF</span>
</a>
{# Sorties #}
<a href="{% url 'budget:set_tab' 'sorties' %}" class="group flex flex-col items-start gap-1 pb-3 pr-8 cursor-pointer transition-colors {% if active_tab == 'sorties' %}text-gold border-b border-gold -mb-px{% else %}text-text-base hover:text-gold{% endif %}">
<span class="flex items-center gap-1.5 text-[9px] font-medium uppercase tracking-wide transition-colors {% if active_tab == 'sorties' %}text-gold{% else %}text-text-muted group-hover:text-gold{% endif %}">
<svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
<path stroke-linecap="round" stroke-linejoin="round" d="m19.5 4.5-15 15m0 0h11.25m-11.25 0V8.25" />
</svg>
Sorties
</span>
<span class="text-base font-bold">−{{ total_expenses_abs|chf_pref:show_decimals }} CHF</span>
</a>
{# Disponible — non cliquable, toujours gris #}
<div class="flex flex-col items-start gap-1 pb-3 pr-8 cursor-default text-text-muted">
<span class="flex items-center gap-1.5 text-[9px] font-medium uppercase tracking-wide">
<svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
<path stroke-linecap="round" stroke-linejoin="round" d="M12 3v17.25m0 0c-1.472 0-2.882.265-4.185.75M12 20.25c1.472 0 2.882.265 4.185.75M18.75 4.97A48.416 48.416 0 0 0 12 4.5c-2.291 0-4.545.16-6.75.47m13.5 0c1.01.143 2.01.317 3 .52m-3-.52 2.62 10.726c.122.499-.106 1.028-.589 1.202a5.988 5.988 0 0 1-2.031.352 5.988 5.988 0 0 1-2.031-.352c-.483-.174-.711-.703-.59-1.202L18.75 4.971Zm-16.5.52c.99.203 1.99.377 3 .52m0 0 2.62 10.726c.122.499-.106 1.028-.589 1.202a5.989 5.988 0 0 1-2.031.352 5.989 5.988 0 0 1-2.031-.352c-.483-.174-.711-.703-.59-1.202L5.25 5.491Z" />
</svg>
Disponible
</span>
{% if total_available >= 0 %}
<span class="text-base font-bold text-income">+{{ total_available|chf_pref:show_decimals }} CHF</span>
{% else %}
<span class="text-base font-bold text-expense">−{{ total_available|chf_pref:show_decimals }} CHF</span>
{% endif %}
</div>
{# Récurrentes — cliquable, même pattern que Entrées/Sorties #}
<a href="{% url 'budget:set_tab' 'recurrentes' %}" class="group flex flex-col items-start gap-1 pb-3 pr-8 cursor-pointer transition-colors {% if active_tab == 'recurrentes' %}text-gold border-b border-gold -mb-px{% else %}text-text-base hover:text-gold{% endif %}">
<span class="flex items-center gap-1.5 text-[9px] font-medium uppercase tracking-wide transition-colors {% if active_tab == 'recurrentes' %}text-gold{% else %}text-text-muted group-hover:text-gold{% endif %}">
<svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
<path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99" />
</svg>
Récurrentes
</span>
<span class="text-base font-bold">−{{ total_recurring|chf_pref:show_decimals }} CHF</span>
</a>
{# Boutons actions — alignés à droite, même ligne que les KPIs #}
<div class="ml-auto flex items-center gap-1.5 pb-3">
{# Tout voir — HTMX : charge la liste transactions dans #panel-content #}
<button hx-get="{% url 'budget:panel_transactions' %}" hx-target="#panel-content" hx-swap="innerHTML" hx-on::after-request="openPanel()" class="flex items-center gap-1.5 px-3 py-1.5 text-xs text-text-base bg-surface-hover rounded-full hover:bg-edge hover:text-gold transition-colors">
<svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
<path stroke-linecap="round" stroke-linejoin="round" d="M3.75 12h16.5m-16.5 3.75h16.5M3.75 19.5h16.5M5.625 4.5h12.75a1.875 1.875 0 0 1 0 3.75H5.625a1.875 1.875 0 0 1 0-3.75Z" />
</svg>
Tout voir
</button>
{# Créer — dropdown #}
<div class="relative" id="creer-dropdown-container">
<button type="button" onclick="document.getElementById('creer-menu').classList.toggle('hidden')" class="flex items-center gap-1.5 px-3 py-1.5 text-xs text-text-base bg-surface-hover hover:bg-edge hover:text-gold rounded-full transition-colors">
<svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor">
<path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
</svg>
Créer
</button>
<div id="creer-menu" class="hidden absolute left-0 top-full mt-2 w-80 bg-surface-3 border border-edge/70 rounded-2xl shadow-2xl z-20 py-1.5 overflow-hidden">
<button type="button" hx-get="{% url 'budget:panel_category_create' %}" hx-target="#modal-content" hx-swap="innerHTML" onclick="document.getElementById('creer-menu').classList.add('hidden')" class="w-full flex items-center gap-3 px-4 py-2.5 text-sm text-text-secondary hover:bg-surface-hover transition-colors">
<span class="w-7 h-7 rounded-xl bg-surface-hover border border-edge/50 flex items-center justify-center flex-shrink-0">
<svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
<path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12.75V12A2.25 2.25 0 0 1 4.5 9.75h15A2.25 2.25 0 0 1 21.75 12v.75m-8.69-6.44-2.12-2.12a1.5 1.5 0 0 0-1.061-.44H4.5A2.25 2.25 0 0 0 2.25 6v12a2.25 2.25 0 0 0 2.25 2.25h15A2.25 2.25 0 0 0 21.75 18V9a2.25 2.25 0 0 0-2.25-2.25h-5.379a1.5 1.5 0 0 1-1.06-.44Z" />
</svg>
</span>
<span class="flex-1 text-left">Nouvelle catégorie</span>
</button>
<button type="button" hx-get="{% url 'budget:panel_rule_create_standalone' %}" hx-target="#modal-content" hx-swap="innerHTML" onclick="document.getElementById('creer-menu').classList.add('hidden'); openModal()" class="w-full flex items-center gap-3 px-4 py-2.5 text-sm text-text-secondary hover:bg-surface-hover transition-colors">
<span class="w-7 h-7 rounded-xl bg-surface-hover border border-edge/50 flex items-center justify-center flex-shrink-0">
<svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
<path stroke-linecap="round" stroke-linejoin="round" d="M9.813 15.904 9 18.75l-.813-2.846a4.5 4.5 0 0 0-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 0 0 3.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 0 0 3.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 0 0-3.09 3.09Z" />
<path stroke-linecap="round" stroke-linejoin="round" d="M18.259 8.715 18 9.75l-.259-1.035a3.375 3.375 0 0 0-2.455-2.456L14.25 6l1.036-.259a3.375 3.375 0 0 0 2.455-2.456L18 2.25l.259 1.035a3.375 3.375 0 0 0 2.456 2.456L21.75 6l-1.035.259a3.375 3.375 0 0 0-2.456 2.456Z" />
</svg>
</span>
<span class="flex-1 text-left">Nouvelle règle intelligente</span>
</button>
<button type="button" hx-get="{% url 'budget:modal_target_create' %}" hx-target="#modal-content" hx-swap="innerHTML" onclick="document.getElementById('creer-menu').classList.add('hidden')" class="w-full flex items-center gap-3 px-4 py-2.5 text-sm text-text-base hover:bg-surface-hover transition-colors">
<span class="w-7 h-7 rounded-xl bg-surface-hover border border-edge/50 flex items-center justify-center flex-shrink-0">
<svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
<path stroke-linecap="round" stroke-linejoin="round" d="M12 3a9 9 0 1 0 0 18A9 9 0 0 0 12 3Z" />
<path stroke-linecap="round" stroke-linejoin="round" d="M12 7a5 5 0 1 0 0 10A5 5 0 0 0 12 7Z" />
<circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none" />
</svg>
</span>
<span class="flex-1 text-left">Nouvel objectif de dépense</span>
</button>
</div>
</div>
{# Paramètres — dropdown préférences + export #}
<div class="relative" id="params-dropdown-container">
<button type="button" onclick="document.getElementById('params-menu').classList.toggle('hidden')" class="flex items-center gap-1 px-3 py-1.5 text-xs rounded-full transition-colors text-text-base bg-surface-hover hover:bg-edge hover:text-gold">
Paramètres
<svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
<path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
</svg>
</button>
<div id="params-menu" class="hidden absolute right-0 top-full mt-2 w-80 bg-surface-3 border border-edge/70 rounded-2xl shadow-2xl z-20 py-1.5 overflow-hidden">
<p class="px-4 pt-2 pb-1 text-[9px] font-bold text-text-disabled uppercase tracking-widest">Affichage</p>
<form method="post" action="{% url 'budget:toggle_decimals' %}" class="contents">
{% csrf_token %}
<button type="submit" onclick="document.getElementById('params-menu').classList.add('hidden')" class="w-full flex items-center gap-3 px-4 py-2.5 text-sm text-text-base hover:bg-surface-hover transition-colors">
<span class="w-6 h-6 rounded-lg bg-surface-hover border border-edge/50 flex items-center justify-center flex-shrink-0">
<svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
<path stroke-linecap="round" stroke-linejoin="round" d="M7.5 14.25v2.25m3-4.5v4.5m3-6.75v6.75m3-9v9M6 20.25h12A2.25 2.25 0 0 0 20.25 18V6A2.25 2.25 0 0 0 18 3.75H6A2.25 2.25 0 0 0 3.75 6v12A2.25 2.25 0 0 0 6 20.25Z" />
</svg>
</span>
<span class="flex-1 text-left">Afficher les décimales</span>
{% if show_decimals %}
<svg class="w-3.5 h-3.5 text-gold" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor">
<path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5" />
</svg>
{% endif %}
</button>
</form>
<p class="px-4 pt-2 pb-1 text-[9px] font-bold text-text-disabled uppercase tracking-widest">Données</p>
<button type="button" hx-get="{% url 'budget:panel_rules_list' %}" hx-target="#modal-content" hx-swap="innerHTML" onclick="document.getElementById('params-menu').classList.add('hidden')" class="w-full flex items-center gap-3 px-4 py-2.5 text-sm text-text-base hover:bg-surface-hover transition-colors">
<span class="w-6 h-6 rounded-lg bg-surface-hover border border-edge/50 flex items-center justify-center flex-shrink-0">
<svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
<path stroke-linecap="round" stroke-linejoin="round" d="M9.813 15.904 9 18.75l-.813-2.846a4.5 4.5 0 0 0-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 0 0 3.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 0 0 3.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 0 0-3.09 3.09Z" />
<path stroke-linecap="round" stroke-linejoin="round" d="M18.259 8.715 18 9.75l-.259-1.035a3.375 3.375 0 0 0-2.455-2.456L14.25 6l1.036-.259a3.375 3.375 0 0 0 2.455-2.456L18 2.25l.259 1.035a3.375 3.375 0 0 0 2.456 2.456L21.75 6l-1.035.259a3.375 3.375 0 0 0-2.456 2.456Z" />
</svg>
</span>
<span class="flex-1 text-left">Gérer les règles intelligentes</span>
<svg class="w-3 h-3 text-text-disabled" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
<path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5" />
</svg>
</button>
<button type="button" hx-get="{% url 'budget:panel_category_manage' %}" hx-target="#modal-content" hx-swap="innerHTML" onclick="document.getElementById('params-menu').classList.add('hidden')" class="w-full flex items-center gap-3 px-4 py-2.5 text-sm text-text-base hover:bg-surface-hover transition-colors">
<span class="w-6 h-6 rounded-lg bg-surface-hover border border-edge/50 flex items-center justify-center flex-shrink-0">
<svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
<path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 0 1 6 3.75h2.25A2.25 2.25 0 0 1 10.5 6v2.25a2.25 2.25 0 0 1-2.25 2.25H6a2.25 2.25 0 0 1-2.25-2.25V6ZM3.75 15.75A2.25 2.25 0 0 1 6 13.5h2.25a2.25 2.25 0 0 1 2.25 2.25V18a2.25 2.25 0 0 1-2.25 2.25H6A2.25 2.25 0 0 1 3.75 18v-2.25ZM13.5 6a2.25 2.25 0 0 1 2.25-2.25H18A2.25 2.25 0 0 1 20.25 6v2.25A2.25 2.25 0 0 1 18 10.5h-2.25a2.25 2.25 0 0 1-2.25-2.25V6ZM13.5 15.75a2.25 2.25 0 0 1 2.25-2.25H18a2.25 2.25 0 0 1 2.25 2.25V18A2.25 2.25 0 0 1 18 20.25h-2.25A2.25 2.25 0 0 1 13.5 18v-2.25Z" />
</svg>
</span>
<span class="flex-1 text-left">Gérer les catégories</span>
</button>
</div>
</div>
</div>
</div>
{# ── Liste catégories ─────────────────────────────────────────────────── #}
<div class="pt-3">
<p class="text-[10px] text-text-muted uppercase tracking-wide mb-2">
{{ active_categories|length }} catégorie{{ active_categories|length|pluralize }} {{ tab_label_suffix }}
</p>
{% if active_categories %}
<div class="flex flex-col gap-1.5">
{% for cat in active_categories %}
<a href="{% url 'budget:category_detail' cat.category__slug %}" class="flex items-center gap-3 px-3 py-3 rounded-xl bg-surface-3 hover:bg-surface-hover cursor-pointer group transition-colors">
{% with icon_path="icons/categories/"|add:cat.category__icon|add:".svg" %}
<div class="relative w-10 h-10 flex-shrink-0 flex items-center justify-center">
{% if cat.target_pct is not None %}
<svg class="absolute inset-0 w-full h-full -rotate-90" viewBox="0 0 36 36">
<circle cx="18" cy="18" r="16" fill="none" stroke="{{ cat.category__colour_hex|default:'#4ade80' }}" stroke-opacity="0.2" stroke-width="3.5" stroke-dasharray="100 100" />
<circle cx="18" cy="18" r="16" fill="none" stroke="{{ cat.category__colour_hex|default:'#4ade80' }}" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="{{ cat.target_pct }} 100" />
</svg>
{% endif %}
<div class="w-7 h-7 rounded-full flex items-center justify-center" style="background-color: {{ cat.category__colour_hex|default:'#2d3033' }}">
{% if cat.category__icon %}
<img src="{% static icon_path %}" width="16" height="16" class="w-4 h-4 brightness-0 invert" alt="">
{% else %}
<span class="text-white text-xs font-bold">{{ cat.category__name|slice:":1" }}</span>
{% endif %}
</div>
</div>
{% endwith %}
<div class="flex-1 min-w-0">
<p class="text-sm font-medium text-text-base">{{ cat.category__name }}</p>
{% if cat.target_raw_pct is not None %}
{% if cat.target_overspend_chf is not None %}
<p class="text-[10px] text-warning leading-tight mt-0.5">{{ cat.target_overspend_chf }} CHF au-dessus de l'objectif</p>
{% else %}
<p class="text-[10px] text-income leading-tight mt-0.5">{{ cat.target_raw_pct }}% de l'objectif</p>
{% endif %}
{% endif %}
</div>
<span class="text-sm font-semibold text-text-base tabular-nums">
{% if cat.total >= 0 %}
+
{% else %}
−
{% endif %}
{{ cat.total|chf_pref:show_decimals }} CHF
</span>
<div class="w-5 h-5 rounded-full border border-edge flex items-center justify-center flex-shrink-0 group-hover:border-gold transition-colors">
<svg class="w-2.5 h-2.5 text-text-muted group-hover:text-gold" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor">
<path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5" />
</svg>
</div>
</a>
{% endfor %}
</div>
{% else %}

{% if is_htmx_partial %}
{# Reinit Sankey ECharts après swap HTMX (auto-init.js gère le premier chargement) #}
<script>
    (function () {
        if (typeof BricCharts === "undefined") return;
        var el = document.getElementById("sankey-chart");
        if (!el) return;
        if (typeof echarts !== "undefined" && echarts.getInstanceByDom(el)) {
            echarts.dispose(el);
        }
        var dataEl = document.getElementById("sankey-data");
        if (!dataEl) return;
        var data;
        try { data = JSON.parse(dataEl.textContent); } catch (e) { return; }
        BricCharts.initSankey(el, data, {
            onNodeClick: function (node) {
                if (node && node.slug) window.location.href = "/budget/categorie/" + node.slug + "/";
            }
        });
        el.dataset.chartInitialized = "1";
    })();
</script>
{% endif %}
