<!DOCTYPE html>
<!--
  registration/login.html — Minimal login page for Phase 0B.
  Phase 2C will replace this with the full BricBudget dark theme.

  Django's auth view passes two variables into this template:
    - form        : the AuthenticationForm (email + password fields)
    - next        : the URL the user was trying to reach before being redirected here
                    (Django adds it automatically when LOGIN_URL redirects)

  The {% csrf_token %} tag is mandatory on every POST form in Django.
  It inserts a hidden input with a secret token that Django checks on submit
  to prevent Cross-Site Request Forgery attacks.
-->
<html lang="fr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="BricBudget login" />
        <meta name="keywords" content="bricbudget" />
        <title>BricBudget — Login</title>
        <style>
      body {
        font-family: sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        background: #111318;
        color: #e5e7eb;
      }
      form {
        background: #1c1f26;
        padding: 2rem;
        border-radius: 8px;
        width: 320px;
      }
      h1 {
        margin: 0 0 1.5rem;
        font-size: 1.25rem;
      }
      label {
        display: block;
        font-size: 0.85rem;
        margin-bottom: 0.25rem;
        color: #9ca3af;
      }
      input {
        width: 100%;
        padding: 0.5rem;
        border: 1px solid #374151;
        border-radius: 4px;
        background: #111318;
        color: #e5e7eb;
        margin-bottom: 1rem;
        box-sizing: border-box;
      }
      button {
        width: 100%;
        padding: 0.6rem;
        background: #3b82f6;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 0.95rem;
      }
      .errors {
        color: #f87171;
        font-size: 0.85rem;
        margin-bottom: 1rem;
      }
        </style>
    </head>
    <body>
        <form method="post">
            {% csrf_token %}
            <!-- `next` preserves the page the user was trying to reach — Django re-redirects there after login -->
            {% if next %}<input type="hidden" name="next" value="{{ next }}" />{% endif %}
            <h1>BricBudget</h1>
            {% if form.errors %}<div class="errors">Email ou mot de passe incorrect.</div>{% endif %}
            <label for="id_username">Email</label>
            {{ form.username }}
            <label for="id_password">Mot de passe</label>
            {{ form.password }}
            <button type="submit">Se connecter</button>
        </form>
    </body>
</html>
