{% comment %}
imports/partials/_activity_section.html — Section graphique d'activité.

Rendu complet à chaque swap HTMX (period_nav ou filtre compte).
Le <script> inline ré-initialise ECharts après chaque swap.
{% endcomment %}
{% load static bank_icons %}
<div id="activity-chart-section">
{# 1. Navigation période — full width, même layout que budget/index.html #}
{% include "components/period/period_nav.html" with period_mode=period_mode period_display=period_display can_go_next=can_go_next nav_url_name="imports:set_period" htmx_target="#activity-chart-section" %}
<div class="border-t border-edge my-3"></div>
{# 2. Titre + filtre compte — identique au row "Cashflow" du Sankey #}
<div class="flex items-center justify-between pb-2">
<h2 class="text-sm font-semibold text-text-base">Activité</h2>
{% include "components/filters/filter_accounts.html" with accounts=accounts hidden_account_ids=filter_account_ids toggle_url_name="imports:toggle_filter_account" htmx_target="#activity-chart-section" filter_open=filter_open %}
</div>
{{ chart_data|json_script:"import-chart-data" }}
<div id="import-chart" style="height: 220px; width: 100%;"></div>
<script>
    // Swap HTMX : les vendors sont déjà chargés, on peut initialiser directement.
    // Au chargement initial, BricCharts n'est pas encore défini (extra_js vient après) —
    // dans ce cas extra_js appelle initActivityChart() après avoir chargé les vendors.
    (function () {
      if (typeof BricCharts === "undefined") return;
      var el = document.getElementById("import-chart");
      if (!el) return;
      if (typeof echarts !== "undefined" && echarts.getInstanceByDom(el)) {
        echarts.dispose(el);
      }
      var data = JSON.parse(document.getElementById("import-chart-data").textContent);
      var ch = BricCharts.initActivity(el, data);
      ch.renderActivity("{{ period_mode }}", "created", {{ period_offset }});
      window.addEventListener("resize", function () { ch.resize(); });
    })();
</script>
</div>
