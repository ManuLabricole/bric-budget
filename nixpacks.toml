# nixpacks.toml — recette de build pour Railway
#
# Nixpacks est l'outil que Railway utilise pour transformer ton code source
# en image Docker prête à déployer. Sans ce fichier, il devine (souvent mal).
# Avec ce fichier, tu contrôles exactement chaque étape.
#
# Les phases s'enchaînent dans cet ordre :
#   setup → install → build → [pre-deploy] → start
#
# "setup"   : choisit les outils système (Python, Node, etc.)
# "install" : installe les dépendances (poetry install)
# "build"   : commandes à lancer une seule fois après l'install
# "start"   : commande de démarrage (on utilise le Procfile à la place)
#
# Le [pre-deploy] entre build et start n'est PAS une phase nixpacks : c'est une étape
# Railway (migrate && sync_reference_data) définie dans railway.json (#135), pas ici.

# ── Phase setup ───────────────────────────────────────────────────────────────
# On déclare explicitement Python 3.13 pour ne pas dépendre de la détection auto.
# nixpacks utilise Nix en dessous — "python313" est le nom du package Nix.
[phases.setup]
nixPkgs = ["python313"]

# ── Phase install ─────────────────────────────────────────────────────────────
# Nixpacks détecte pyproject.toml et lance poetry install automatiquement.
# On n'a pas besoin de le redéclarer ici — c'est le comportement par défaut.
# Si on voulait l'overrider : cmds = ["poetry install --no-dev"]

# ── Phase build ───────────────────────────────────────────────────────────────
# Commandes lancées une seule fois pendant le build, après poetry install.
# L'image Docker est construite ici — ces commandes ne tournent pas à chaque démarrage.
#
# collectstatic :
#   Copie tous les fichiers statiques (CSS, SVG, JS, images) depuis src/static/
#   vers src/staticfiles/. C'est ce dossier que WhiteNoise servira en prod.
#   Sans ça : page blanche (pas de CSS), icônes manquantes, Tailwind absent.
#
# On ne lance PAS migrate ici.
# Pourquoi : migrate modifie la base de données. La DB n'est pas disponible
# pendant le build (le container n'a pas encore accès aux variables d'env Railway
# comme DATABASE_URL). Les migrations + le seed des référentiels tournent en
# pre-deploy (DB accessible) : voir railway.json (deploy.preDeployCommand, #135).
[phases.build]
cmds = [
  # SECRET_KEY inline : Railway n'injecte pas toujours les variables pendant le build.
  # Sans SECRET_KEY, Django refuse de démarrer → collectstatic crashe silencieusement.
  # Cette valeur est utilisée UNIQUEMENT pour collectstatic (copie de fichiers statiques).
  # Elle ne signe rien, ne sécurise rien — la vraie SECRET_KEY vient de Railway en prod.
  "cd src && SECRET_KEY=build-only-not-secret ALLOWED_HOSTS=localhost DEBUG=False poetry run python manage.py collectstatic --noinput",
]

# ── Start ──────────────────────────────────────────────────────────────────────
# On laisse Railway lire le Procfile plutôt que de répéter la commande ici.
# Si on déclarait "cmd" ici, ça écraserait le Procfile — on veut éviter la duplication.
# Railway cherche le Procfile automatiquement quand "cmd" n'est pas défini.
