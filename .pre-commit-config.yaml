# .pre-commit-config.yaml — runs before every git commit
#
# Install hooks:  poetry run pre-commit install
# Run manually:   poetry run pre-commit run --all-files
#
# How it works:
#   pre-commit intercepts `git commit`, runs the hooks below,
#   and blocks the commit if any hook fails or modifies files.
#   If ruff auto-fixes something, the commit is blocked so you
#   can review the fix and re-stage before committing.

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.4   # keep in sync with pyproject.toml ruff version
    hooks:
      # 1. Lint — catches unused imports, undefined names, style issues
      - id: ruff
        args: [--fix]   # auto-fix what can be fixed

      # 2. Format — enforces consistent style (replaces Black)
      - id: ruff-format
