# .pre-commit-config.yaml — runs before every git commit
#
# Install hooks:
#   poetry run pre-commit install                        ← pre-commit + pre-push stages
#   poetry run pre-commit install --hook-type commit-msg ← commit-msg stage (commitizen)
#
# Run manually:
#   poetry run pre-commit run --all-files
#
# How it works:
#   pre-commit intercepts `git commit`, runs the hooks below in order,
#   and blocks the commit if any hook fails or modifies files.
#   If ruff auto-fixes something, the commit is blocked so you can
#   review the fix and re-stage before committing.

repos:
  # ---------------------------------------------------------------------------
  # Ruff — linter + formatter (replaces flake8, black, isort)
  # ---------------------------------------------------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.4   # keep in sync with pyproject.toml ruff version
    hooks:
      # 1. Lint — catches unused imports, undefined names, style issues
      - id: ruff
        args: [--fix]

      # 2. Format — enforces consistent style (replaces Black)
      - id: ruff-format

  # ---------------------------------------------------------------------------
  # djLint — Django template linter + formatter
  # No templates yet (Phase 1B) — hook passes silently until then.
  # ---------------------------------------------------------------------------
  - repo: https://github.com/Riverside-Healthcare/djLint
    rev: v1.36.4   # keep in sync with pyproject.toml djlint version
    hooks:
      # Reformat templates (indentation, spacing)
      - id: djlint-reformat-django

      # Lint templates (missing closing tags, bad attributes...)
      - id: djlint-django

  # ---------------------------------------------------------------------------
  # Local hooks — project-specific checks
  # ---------------------------------------------------------------------------
  - repo: local
    hooks:
      # Bloc les identifiants bancaires hardcodés dans les fichiers Python.
      # Patterns détectés :
      #   - IBAN CH/FR : CH\d{2} ou FR\d{2} suivi de caractères alphanumériques
      #   - RIB CIC    : séquence de 20-22 chiffres consécutifs (numéros de contrat)
      # Les fichiers .env, .env.example, et les migrations sont exclus.
      # Si ce hook bloque un faux positif, ajouter le fichier dans exclude ci-dessous.
      - id: no-hardcoded-bank-ids
        name: No hardcoded bank identifiers (IBAN / RIB)
        language: pygrep
        entry: '(CH\d{2}[A-Z0-9]{15,}|FR\d{2}[A-Z0-9]{20,}|\b\d{20,22}\b)'
        types: [python]
        exclude: ^(src/[^/]+/migrations/|\.env)

  # ---------------------------------------------------------------------------
  # Commitizen — enforces Conventional Commits message format
  # Runs at commit-msg stage (after you type your message).
  # Valid:   feat(accounts): add Card model
  # Invalid: "added card" → blocked
  # Install: poetry run pre-commit install --hook-type commit-msg
  # ---------------------------------------------------------------------------
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.13.9   # keep in sync with pyproject.toml commitizen version
    hooks:
      - id: commitizen
        stages: [commit-msg]
