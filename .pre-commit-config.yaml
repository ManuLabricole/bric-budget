# .pre-commit-config.yaml — runs before every git commit
#
# Install hooks:
#   poetry run pre-commit install                        ← pre-commit + pre-push stages
#   poetry run pre-commit install --hook-type commit-msg ← commit-msg stage (commitizen)
#
# Run manually:
#   poetry run pre-commit run --all-files
#
# How it works:
#   pre-commit intercepts `git commit`, runs the hooks below in order,
#   and blocks the commit if any hook fails or modifies files.
#   If ruff auto-fixes something, the commit is blocked so you can
#   review the fix and re-stage before committing.

# Install ALL hook stages with a single `pre-commit install` — including
# prepare-commit-msg, used below to stamp the .claude config version.
default_install_hook_types: [pre-commit, commit-msg, prepare-commit-msg, pre-push]

# Sans ceci, un hook sans `stages:` tourne à CHAQUE stage installé (3× ruff/djlint
# par commit !). On limite le défaut à pre-commit ; les hooks à stage explicite
# (stamp=prepare-commit-msg, commitizen=commit-msg, pytest=pre-push) gardent le leur.
default_stages: [pre-commit]

repos:
  # ---------------------------------------------------------------------------
  # Ruff — linter + formatter (replaces flake8, black, isort)
  # ---------------------------------------------------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.4   # keep in sync with pyproject.toml ruff version
    hooks:
      # 1. Lint — catches unused imports, undefined names, style issues
      - id: ruff
        args: [--fix]

      # 2. Format — enforces consistent style (replaces Black)
      - id: ruff-format

  # ---------------------------------------------------------------------------
  # djLint — Django template linter + formatter
  # No templates yet (Phase 1B) — hook passes silently until then.
  # ---------------------------------------------------------------------------
  - repo: https://github.com/Riverside-Healthcare/djLint
    rev: v1.36.4   # keep in sync with pyproject.toml djlint version
    hooks:
      # Reformat templates (indentation, spacing)
      - id: djlint-reformat-django

      # Lint templates (missing closing tags, bad attributes...)
      - id: djlint-django

  # ---------------------------------------------------------------------------
  # Local hooks — project-specific checks
  # ---------------------------------------------------------------------------
  - repo: local
    hooks:
      # Bloc les identifiants bancaires hardcodés dans les fichiers Python.
      # Patterns détectés :
      #   - IBAN CH/FR : CH\d{2} ou FR\d{2} suivi de caractères alphanumériques
      #   - RIB CIC    : séquence de 20-22 chiffres consécutifs (numéros de contrat)
      # Les fichiers .env, .env.example, et les migrations sont exclus.
      # Si ce hook bloque un faux positif, ajouter le fichier dans exclude ci-dessous.
      # Lance pytest avant chaque PUSH (pas chaque commit — sinon ~3 min à chaque commit).
      # pass_filenames: false → pytest reçoit ses args depuis pyproject.toml, pas la liste des fichiers modifiés.
      # always_run: true → tourne même si aucun fichier Python n'a changé (ex: commit de template seul).
      # La DB PostgreSQL doit tourner (make up) — si elle est arrêtée, pytest échoue et bloque le commit.
      - id: pytest
        name: pytest
        language: system
        entry: poetry run pytest --tb=short -q
        pass_filenames: false
        always_run: true
        stages: [pre-push]   # ← tourne avant `git push`, PAS à chaque commit

      - id: no-hardcoded-bank-ids
        name: No hardcoded bank identifiers (IBAN / RIB)
        language: pygrep
        entry: '(CH\d{2}[A-Z0-9]{15,}|FR\d{2}[A-Z0-9]{20,}|\b\d{20,22}\b)'
        types: [python]
        exclude: ^(src/[^/]+/migrations/|src/tests/|\.env)

      # Stamp the .claude config version (.claude/VERSION) as a
      # `Claude-Config: vX.Y.Z` git trailer on EVERY commit. Idempotent, never blocks.
      # Runs at prepare-commit-msg, BEFORE commitizen validates at commit-msg.
      - id: stamp-claude-config-version
        name: Stamp .claude config version
        language: system
        stages: [prepare-commit-msg]
        entry: bash scripts/stamp_claude_version.sh
        always_run: true

      # Bloque tout commit DIRECT sur main / development (feature branches only).
      # N'affecte PAS les merges (git merge → hook pre-merge-commit, pas pre-commit).
      - id: no-commit-on-protected-branch
        name: No direct commits on main / development
        language: system
        always_run: true
        pass_filenames: false
        entry: bash scripts/guard_protected_branch.sh

  # ---------------------------------------------------------------------------
  # Commitizen — enforces Conventional Commits message format
  # Runs at commit-msg stage (after you type your message).
  # Valid:   feat(accounts): add Card model
  # Invalid: "added card" → blocked
  # Install: poetry run pre-commit install --hook-type commit-msg
  # ---------------------------------------------------------------------------
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.13.9   # keep in sync with pyproject.toml commitizen version
    hooks:
      - id: commitizen
        stages: [commit-msg]
