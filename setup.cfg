# Mutation testing (mutmut) — #198. Tourne en NIGHTLY (cf. .github/workflows/mutation.yml),
# jamais par-PR (trop lent). Mesure la VRAIE qualité des tests : un mutant "survivant"
# = du code qu'aucun test ne discrimine (couverture sans détection).
#
# Périmètre SCOPPÉ aux modules à valeur monétaire / sécurité :
#   services/         → argent, FX, Decimal
#   transactions/     → manager for_user (IDOR/SR-001) + modèles
#   connectors/       → parsers d'import
#
# mutmut 3.x copie le projet dans mutants/ et lance pytest par mutant → also_copy doit
# embarquer le source ET les ressources que la suite touche (scripts/gen_palette.py via
# test_colors, assets/ tokens). tests_dir est scoppé aux suites qui couvrent le périmètre
# (vitesse). Valeurs multi-chemins = une par ligne (le format virgule casse le parsing).
[mutmut]
paths_to_mutate=
    src/services/
    src/transactions/models.py
    src/transactions/managers.py
    src/connectors/
tests_dir=
    src/tests/services/
    src/tests/transactions/
    src/tests/connectors/
also_copy=
    src/
    scripts/
    assets/
