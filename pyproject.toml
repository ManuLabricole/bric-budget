[project]
name = "bric-budget"
version = "0.2.0"
description = "Personal budget tracker"
authors = [
    {name = "ManuLabricole",email = "emmanuel.barriol@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    "django (>=6.0.6,<7.0.0)",
    "psycopg2-binary (>=2.9.12,<3.0.0)",
    "python-decouple (>=3.8,<4.0)",
    "openpyxl (>=3.1.5,<4.0.0)",
    "cryptography (>=48.0.0,<49.0.0)",
    "whitenoise (>=6.12.0,<7.0.0)",
    "gunicorn (>=26.0.0,<27.0.0)",
    "django-axes (>=8.3.1,<9.0.0)",
    "pillow (>=12.2.0,<13.0.0)",
    "django-storages[s3] (>=1.14.6,<2.0.0)",
    "boto3 (>=1.43.29,<2.0.0)",
    "sentry-sdk[django] (>=2.0.0,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
ruff = "^0.15.20"
djlint = "^1.39.4"
commitizen = "^4.16.4"
pytest = "^9.1"
pytest-django = "^4.12"
mutmut = "^3.6.0"  # mutation testing (#198), tourne en nightly scoppé — voir [tool.mutmut]


# =============================================================================
# pytest — test runner
# Docs: https://docs.pytest.org + https://pytest-django.readthedocs.io
#
# DJANGO_SETTINGS_MODULE : même settings que prod — pytest-django crée un DB de test
#   vide (test_bricbudget) au lancement, le supprime après.
# pythonpath = ["src"] : ajoute src/ à sys.path → "from connectors.yuh.parser import ..."
#   fonctionne sans package install ni PYTHONPATH manuel.
# testpaths : limite la découverte à src/tests/ pour ne pas scanner tout le projet.
# =============================================================================
pytest-cov = "^7.1.0"
bandit = "^1.9.4"
vulture = "^2.16"
mypy = "^2.1.0"
django-stubs = "^6.0.6"
djhtml = "^3.0.11"
pip-audit = "^2.10.1"
pytest-testmon = "^2.2.0"
pytest-randomly = "^4.0"
pytest-xdist = "^3.8.0"
django-test-migrations = "^1.5.0"
factory-boy = "^3.3.3"
pytest-factoryboy = "^2.8.1"
playwright = "^1.60.0"
pytest-playwright = "^0.8.0"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["src"]
testpaths = ["src/tests"]
# addopts : options passées à CHAQUE run pytest.
#   -m "not e2e" → EXCLUT par défaut les tests navigateur Playwright (#159).
#     Ils vivent sous src/tests/e2e/ donc testpaths les découvrirait, mais ils
#     exigent un chromium installé (`playwright install chromium`) absent du
#     pre-push et du job CI principal `test` → sans ce filtre ils ERREUR-eraient
#     (pas skip). On les opt-in explicitement via `pytest -m e2e` (job CI e2e dédié).
addopts = "-m \"not e2e\""
# markers : déclare les marqueurs custom pour éviter le warning "unknown mark".
markers = [
    "e2e: test end-to-end navigateur (Playwright + live_server). Opt-in, headless.",
]


# =============================================================================
# Ruff — linter + formatter (replaces flake8, black, isort)
# Docs: https://docs.astral.sh/ruff/
# =============================================================================

[tool.ruff]
# Where to look for Python files
src = ["src"]

# Max line length — 88 is Black's default, widely accepted
line-length = 88

# Target Python version
target-version = "py313"

[tool.ruff.lint]
# Rule sets enabled:
#   E/W  = pycodestyle (basic style)
#   F    = pyflakes (unused imports, undefined names...)
#   I    = isort (import ordering)
#   DJ   = flake8-django (Django-specific: model field checks, admin...)
#   T20  = flake8-print (interdit print() en prod — règle "jamais print()")
select = ["E", "W", "F", "I", "DJ", "T20"]

# Rules we intentionally ignore:
ignore = [
    "E501",  # line too long — handled by the formatter, not the linter
]

# Files to never lint (migrations are auto-generated, no point fixing them)
exclude = [
    "src/*/migrations/*.py",
]

# =============================================================================
# Commitizen — conventional commits enforcer
# Docs: https://commitizen-tools.github.io/commitizen/
# =============================================================================

[tool.commitizen]
# Commit message schema: <type>(<scope>): <subject>
# Types allowed:
#   feat     — new feature
#   fix      — bug fix
#   refactor — code change that is neither feat nor fix
#   chore    — build, tooling, dependencies
#   docs     — documentation only
#   test     — adding or updating tests
#   style    — formatting, no logic change
name = "cz_conventional_commits"
# Source de vérité = le TAG git (pas un champ dans un fichier).
#   version_provider = "scm" → la version est dérivée des tags via `git describe`
#   (cf. doc commitizen « version_provider »). On développe N features sans jamais
#   écrire de numéro à la main ; `cz bump` lit le dernier tag + les Conventional
#   Commits depuis ce tag pour calculer le prochain numéro et créer le nouveau tag.
version_provider = "scm"
tag_format = "v$version"
# major_version_zero = false : on QUITTE le 0.x → l'app entre en production stable.
# Désormais un BREAKING CHANGE bumpe MAJOR (X.0.0), un feat MINOR, un fix PATCH —
# SemVer plein. La graduation v0.1.0 → v1.0.0 est portée par le commit BREAKING
# CHANGE de cette même branche (sortie de la phase pré-release).
major_version_zero = false
# update_changelog_on_bump = true → `cz bump` régénère le CHANGELOG dans la foulée.
update_changelog_on_bump = true
# Baseline = v0.1.0 (audit timeline 2026-06-19). Le 0.2.0 historique (pyproject /
# package.json) est un FANTÔME jamais taggé → abandonné, pas de backfill. La 1ʳᵉ
# release pilotée par cz est v1.0.0 (graduation prod, ce merge dev→main).
# Le champ `[project].version`/`package.json` n'est plus la source de vérité avec
# version_provider="scm" (aucun code ne le lit : package-mode=false, pas de
# __version__) → on ne le rewrite plus au bump, donc pas de `version_files`.

[tool.ruff.lint.isort]
# Tell isort that these are our first-party packages
# so imports are grouped correctly: stdlib → third-party → first-party
known-first-party = ["accounts", "transactions", "users", "connectors", "config"]


# =============================================================================
# djLint — Django template linter
# Docs: https://djlint.com/docs/configuration/
# =============================================================================
[tool.djlint]
profile = "django"
# Règles désactivées délibérément :
#   H021 — inline styles : nécessaires pour le glassmorphism (gradient borders, backdrop-blur)
#           Tailwind ne supporte pas ces propriétés en classes utilitaires.
#   T003 — endblock sans nom : choix Django 6 (endblock vide = moins de bruit)
#   H025 — "orphan tag" : faux positif sur les templates partiels inclus via {% include %}
#           (ex: <details> à la racine sans parent HTML explicite dans le fichier).
ignore = "H021,T003,H025"


# =============================================================================
# mypy — vérification statique de types
# Stratégie graduelle :
#   - check_untyped_defs=true  : vérifie les corps même sans annotations
#   - disallow_untyped_defs=false : code existant non-typé ne bloque pas
#   - Nouveau code : toujours typé (signatures publiques annotées)
#   - Migrations exclues (auto-générées, inutile de les typer)
# =============================================================================
[tool.mypy]
python_version = "3.13"
plugins = ["mypy_django_plugin.main"]

# Permissif sur les imports sans stubs (openpyxl, cryptography, etc.)
ignore_missing_imports = true

# Checks utiles sans bloquer tout le projet
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
strict_equality = true
extra_checks = true
check_untyped_defs = true

# Graduel : on n'impose pas encore les annotations sur tout le code existant
disallow_untyped_defs = false
disallow_incomplete_defs = false

# Source path (aligne avec pytest pythonpath)
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["*.migrations.*", "manage"]
ignore_errors = true

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.coverage.run]
source = ["src"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "src/manage.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
